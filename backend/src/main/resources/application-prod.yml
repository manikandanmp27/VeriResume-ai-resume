spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/verita_db}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:verita_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:verita_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

server:
  port: ${PORT:8080}
