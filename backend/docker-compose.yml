version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verita-postgres
    environment:
      POSTGRES_DB: verita_db
      POSTGRES_USER: verita_user
      POSTGRES_PASSWORD: verita_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verita_user -d verita_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
